apiVersion: v1
kind: Service
metadata:
  name: mydata-np-target
  namespace: bank-platform-mydata
  labels:
    app.kubernetes.io/part-of: mydata-network-policy-verification
spec:
  type: ClusterIP
  selector:
    mydata-prerequisite: target
  ports:
  - name: tcp-probe
    port: 18080
    targetPort: tcp-probe
  - name: egress-probe
    port: 18081
    targetPort: egress-probe
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mydata-np-target
  namespace: bank-platform-mydata
  labels:
    app.kubernetes.io/part-of: mydata-network-policy-verification
spec:
  podSelector:
    matchLabels:
      mydata-prerequisite: target
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          mydata-prerequisite: allowed
    ports:
    - port: 18080
      protocol: TCP
  - from:
    - podSelector:
        matchExpressions:
        - key: mydata-prerequisite
          operator: In
          values:
          - allowed
          - denied
    ports:
    - port: 18081
      protocol: TCP
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mydata-np-clients
  namespace: bank-platform-mydata
  labels:
    app.kubernetes.io/part-of: mydata-network-policy-verification
spec:
  podSelector:
    matchExpressions:
    - key: mydata-prerequisite
      operator: In
      values:
      - allowed
      - denied
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - podSelector:
        matchLabels:
          mydata-prerequisite: target
    ports:
    - port: 18080
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: TCP
    - port: 53
      protocol: UDP
