apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydata-np-target
  namespace: bank-platform-mydata
  labels:
    app.kubernetes.io/part-of: mydata-network-policy-verification
spec:
  replicas: 1
  selector:
    matchLabels:
      mydata-prerequisite: target
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: mydata-network-policy-verification
        mydata-prerequisite: target
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-type: graviton
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: probe
        image: public.ecr.aws/docker/library/python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
        command:
        - python
        - -u
        - -c
        - "import socket,threading\ndef serve(port):\n s=socket.socket()\n s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1)\n\
          \ s.bind(('0.0.0.0',port))\n s.listen()\n while True:\n  c,_=s.accept()\n\
          \  c.close()\nfor port in (18080,18081):\n threading.Thread(target=serve,args=(port,),daemon=True).start()\n\
          threading.Event().wait()\n"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 64Mi
        ports:
        - name: tcp-probe
          containerPort: 18080
        - name: egress-probe
          containerPort: 18081
        readinessProbe:
          tcpSocket:
            port: tcp-probe
          periodSeconds: 2
---
