name: Platform CI (bank demo)

on:
  push:
    branches: [main]
    paths: ['platform/**', '.github/workflows/platform-ci.yml']
  pull_request:
    paths: ['platform/**']

permissions:
  contents: read

jobs:
  python:
    name: Python — pytest (offline)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest boto3 pyyaml pg8000 httpx
      - run: python3 seed/generate.py
      - run: python3 seed/corpus.py   # corpus.jsonl (임베딩 캐시 seed/out/corpus.embeddings.json 은 커밋됨)
      - run: python3 -m pytest tests/ -q
      - name: 금지 패턴 검사 (비밀번호·실 계정·프롬프트 원문 로그)
        run: |
          ! grep -rn --include='*.py' --include='*.ts' --include='*.tsx' --include='*.md' -E '!234Qwer|AKIA[0-9A-Z]{16}' . || (echo "secret-like string found" && exit 1)

  web:
    name: Web — typecheck + build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: platform/web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  gates:
    name: Gates — node:test (tsc/eslint/axe runner)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform/gates } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: test -f package.json && npm ci && npm test || echo "gates not present"

  infra:
    name: Infra — cdk synth
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform/infra } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: mkdir -p ../api-dist && touch ../api-dist/.keep
      - run: npx cdk synth BankPlatform --quiet -c planeDeployed=false
        env: { CDK_DEFAULT_ACCOUNT: '000000000000' }
