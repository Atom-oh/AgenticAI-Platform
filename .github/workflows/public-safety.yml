name: Public safety scan
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    secrets:
      # Optional: without it the scan warns and passes (user decision, PR #30 fix round 1).
      PUBLIC_DENYLIST: { required: false }
permissions: { contents: read }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Tracked files and names
        env: { PUBLIC_DENYLIST: '${{ secrets.PUBLIC_DENYLIST }}' }
        run: |
          # No deny-list configured -> warn and pass; a configured deny-list stays fail-closed.
          allow=
          if [ -z "$PUBLIC_DENYLIST" ]; then allow=--allow-missing-patterns; fi
          umask 077; printf '%s\n' "$PUBLIC_DENYLIST" > "$RUNNER_TEMP/denylist.txt"
          python3 scripts/check_public_identifiers.py --patterns-file "$RUNNER_TEMP/denylist.txt" $allow
